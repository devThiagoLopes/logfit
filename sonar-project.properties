sonar.organization=thiago270906
sonar.projectKey=devThiagoLopes_logfit

sonar.exclusions=**/*.test.ts,**/*.test.tsx,**/*.test.mjs,src/components/ui/**

# Componentes React sem teste de componente (ainda não migrados nesta rodada)
# e arquivos de infraestrutura de teste (zero lógica de negócio própria).
# Pastas inteiras só entram aqui quando NENHUM arquivo delas tem teste —
# pastas mistas (ex: alunos/, matriculas/) listam arquivo por arquivo pra não
# apagar a cobertura real dos componentes já testados.
sonar.coverage.exclusions=\
  vitest.config.ts,\
  vitest.setup.ts,\
  src/components/layout/**,\
  src/components/providers/**,\
  src/components/auth/**,\
  src/components/planos/**,\
  src/components/sensores/**,\
  src/components/usuarios/**,\
  src/components/alunos/aluno-delete-dialog.tsx,\
  src/components/alunos/aluno-form.tsx,\
  src/components/alunos/aluno-form-dialog.tsx,\
  src/components/alunos/aluno-pos-cadastro-dialog.tsx,\
  src/components/alunos/aluno-row-actions.tsx,\
  src/components/alunos/aluno-table-row.tsx,\
  src/components/checkin/checkin-filtros.tsx,\
  src/components/dashboard/movimento-por-hora-chart.tsx,\
  src/components/dashboard/movimento-semana-chart.tsx,\
  src/components/dashboard/periodo-filter.tsx,\
  src/components/dashboard/stat-card.tsx,\
  src/components/matriculas/matricula-form.tsx,\
  src/components/matriculas/matricula-historico.tsx,\
  src/components/matriculas/matricula-pagamento-panel.tsx,\
  src/components/matriculas/matricula-renovacao-automatica-toggle.tsx,\
