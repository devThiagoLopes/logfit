name: Pipeline CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  qualidade:
    name: Qualidade
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

  banco-de-dados:
    name: Banco de dados
    runs-on: ubuntu-latest

    env:
      DATABASE_URL_UNPOOLED: postgres://logfit:logfit@localhost:5433/logfit_test
      BETTER_AUTH_SECRET: test-secret-not-for-production
      BETTER_AUTH_URL: http://localhost:3000
      NODE_ENV: test

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: logfit
          POSTGRES_PASSWORD: logfit
          POSTGRES_DB: logfit_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U logfit -d logfit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Aplicar migrations no banco de teste
        run: npx drizzle-kit migrate

      - name: Rodar testes (relatório JSON)
        run: npx vitest run --reporter=json --outputFile=vitest-results.json
        continue-on-error: true

      - name: Avaliar gate de qualidade (mínimo 90% dos testes passando)
        run: node scripts/check-test-threshold.mjs vitest-results.json 0.9

  deploy:
    name: Deploy
    needs: [qualidade, banco-de-dados]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Vercel CLI
        run: npm install -g vercel

      - name: Baixar configuração do projeto Vercel
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build na Vercel
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy em produção
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
