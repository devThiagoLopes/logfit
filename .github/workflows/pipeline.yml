name: Pipeline CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  qualidade:
    name: Qualidade
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Verificação de tipos
        run: npm run typecheck

  seguranca:
    name: Segurança
    needs: banco-de-dados
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências (sem scripts de build, só precisamos do lockfile e do código-fonte)
        run: npm ci --ignore-scripts

      - name: Auditoria de dependências de produção (bloqueia em alta/crítica)
        run: npm audit --omit=dev --omit=optional --audit-level=high

      - name: Baixar relatório de cobertura
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: coverage/
        continue-on-error: true

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@0303d6b62e310685c0e34d0b9cde218036885c4d # v5.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Avaliar Quality Gate do SonarCloud
        uses: SonarSource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  banco-de-dados:
    name: Banco de dados
    runs-on: ubuntu-latest

    env:
      DATABASE_URL_UNPOOLED: postgres://logfit:${{ secrets.TEST_DB_PASSWORD }}@localhost:5433/logfit_test
      BETTER_AUTH_SECRET: test-secret-not-for-production
      BETTER_AUTH_URL: http://localhost:3000
      NODE_ENV: test

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: logfit
          POSTGRES_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}
          POSTGRES_DB: logfit_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U logfit -d logfit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Aplicar migrations no banco de teste
        run: npx drizzle-kit migrate

      - name: Rodar testes (relatório JSON + cobertura)
        run: npx vitest run --coverage --reporter=json --outputFile=vitest-results.json
        continue-on-error: true

      - name: Avaliar gate de qualidade (mínimo 90% dos testes passando)
        run: node scripts/check-test-threshold.mjs vitest-results.json 0.9

      - name: Publicar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 1
          if-no-files-found: ignore

  deploy:
    name: Deploy
    needs: [qualidade, banco-de-dados, seguranca]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Vercel CLI
        run: npm install -g vercel

      - name: Baixar configuração do projeto Vercel
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build na Vercel
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy em produção
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
