services:
  postgres-test:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: logfit
      POSTGRES_PASSWORD: logfit
      POSTGRES_DB: logfit_test
    ports:
      - "5433:5432"
    volumes:
      - logfit_test_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logfit -d logfit_test"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  logfit_test_db:
