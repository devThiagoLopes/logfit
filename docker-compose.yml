services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-logfit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-logfit}
      POSTGRES_DB: ${POSTGRES_DB:-logfit_dev}
    ports:
      - "5432:5432"
    volumes:
      - logfit_dev_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logfit -d logfit_dev"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  logfit_dev_db:
